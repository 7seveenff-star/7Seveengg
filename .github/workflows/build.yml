name: Build MouseMapperPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/example/mousemapper app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="MouseMapperPro"
          include(":app")
          E
          cat > build.gradle.kts <<'E'
          plugins {
            id("com.android.application") version "8.7.3" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          E
          cat > app/build.gradle.kts <<'E'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace="com.example.mousemapper"; compileSdk=35
            defaultConfig { applicationId="com.example.mousemapper"; minSdk=26; targetSdk=35; versionCode=1; versionName="1.0" }
          }
          E
          cat > app/src/main/res/values/strings.xml <<'E'
          <resources><string name="app_name">Mouse Mapper Pro</string><string name="accessibility_description">Servicio de controles configurados por el usuario.</string></resources>
          E
          cat > app/src/main/res/values/styles.xml <<'E'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#3F51B5</item></style></resources>
          E
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'E'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:description="@string/accessibility_description" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:notificationTimeout="100" android:canRetrieveWindowContent="false" android:canRequestFilterKeyEvents="true" android:accessibilityFlags="flagRequestFilterKeyEvents" />
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><application android:theme="@style/AppTheme" android:label="@string/app_name"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".MapperAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/></service></application></manifest>
          E
          cat > app/src/main/java/com/example/mousemapper/MainActivity.kt <<'E'
          package com.example.mousemapper
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*
          class MainActivity:Activity(){override fun onCreate(b:Bundle?){super.onCreate(b);val l=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;padding(24)};val t=TextView(this).apply{text="Mouse Mapper Pro";textSize=28f};val i=TextView(this).apply{text="Editor y mapeo de controles\n\nActiva Accesibilidad para probar.";textSize=17f};val a=Button(this).apply{text="Añadir punto de control"};val s=Button(this).apply{text="Abrir Accesibilidad"};a.setOnClickListener{Toast.makeText(this,"Punto añadido",Toast.LENGTH_SHORT).show()};s.setOnClickListener{startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))};l.addView(t);l.addView(i);l.addView(a);l.addView(s);setContentView(l)}}
          fun LinearLayout.padding(n:Int){setPadding(n,n,n,n)}
          E
          cat > app/src/main/java/com/example/mousemapper/MapperAccessibilityService.kt <<'E'
          package com.example.mousemapper
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent
          class MapperAccessibilityService:AccessibilityService(){override fun onServiceConnected(){super.onServiceConnected()};override fun onKeyEvent(e:KeyEvent):Boolean{if(e.action!=KeyEvent.ACTION_DOWN)return false;val p=when(e.keyCode){KeyEvent.KEYCODE_DPAD_UP->.5f to .25f;KeyEvent.KEYCODE_DPAD_DOWN->.5f to .75f;KeyEvent.KEYCODE_DPAD_LEFT->.25f to .5f;KeyEvent.KEYCODE_DPAD_RIGHT->.75f to .5f;KeyEvent.KEYCODE_SPACE->.85f to .85f;else->return false};return tap(p.first,p.second)};private fun tap(x:Float,y:Float):Boolean{if(Build.VERSION.SDK_INT<24)return false;val d=resources.displayMetrics;val p=Path().apply{moveTo(x*d.widthPixels,y*d.heightPixels)};return dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p,0,60)).build(),null,null)};override fun onAccessibilityEvent(e:AccessibilityEvent?){};override fun onInterrupt(){}}
          E
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
with:
  packages: 'platform-tools'
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MouseMapperPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
